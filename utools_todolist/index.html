<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在启动 ToDo List 应用...</title>
    <style>
        /* 现代CSS重置和基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a0ca3;
            --secondary-color: #4cc9f0;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --error-color: #f87171;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --border-radius: 16px;
            --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-medium: 0 8px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #e2e8f0 100%);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
        }
        
        /* 主容器样式 */
        .app-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-medium);
            padding: 48px 32px;
            position: relative;
            overflow: hidden;
        }
        
        /* 装饰元素 */
        .app-container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 50%;
            opacity: 0.1;
            z-index: 0;
        }
        
        .app-container::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            border-radius: 50%;
            opacity: 0.08;
            z-index: 0;
        }
        
        /* 应用内容 */
        .app-content {
            position: relative;
            z-index: 1;
        }
        
        /* Logo 区域 */
        .app-logo {
            margin-bottom: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 标题样式 */
        .app-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.2;
        }
        
        .app-title p {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 8px;
            font-weight: 400;
        }
        
        /* 加载状态区域 */
        .loading-section {
            margin: 32px 0;
        }
        
        /* 加载动画 */
        .loading-animation {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .loading-spinner {
            width: 64px;
            height: 64px;
            position: relative;
        }
        
        .spinner-circle {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(67, 97, 238, 0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        
        .spinner-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--primary-color);
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 状态文本 */
        .status-message {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            min-height: 24px;
        }
        
        /* 进度条 */
        .progress-wrapper {
            width: 100%;
            height: 10px;
            background-color: rgba(67, 97, 238, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 5px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        background-color 0.3s ease;
            position: relative;
        }
        
        /* 详细状态信息 */
        .status-details {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            min-height: 40px;
        }
        
        /* 手动跳转按钮 */
        .action-section {
            margin-top: 32px;
        }
        
        .primary-button {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            min-width: 180px;
        }
        
        .primary-button:disabled {
            background: linear-gradient(135deg, #94a3b8, #cbd5e1);
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .app-container {
                padding: 32px 24px;
                margin: 20px;
            }
            
            .app-title {
                font-size: 24px;
            }
            
            .loading-spinner {
                width: 50px;
                height: 50px;
            }
        }
        
        @media (max-width: 480px) {
            .app-container {
                padding: 24px 16px;
                margin: 10px;
            }
            
            .app-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 应用内容 -->
        <div class="app-content">
            <div class="app-logo">
                <img src="./logo.png" width="48" height="48" alt="ToDo List Logo">
            </div>
            <div class="app-title">
                <h1>ToDo List 应用</h1>
                <p>高效管理任务，轻松规划生活</p>
            </div>
            
            <!-- 加载状态区域 -->
            <div class="loading-section">
                <div class="loading-animation">
                    <div class="loading-spinner">
                        <div class="spinner-circle"></div>
                        <div class="spinner-dot"></div>
                    </div>
                </div>
                
                <div id="loading-status" class="status-message">正在准备您的任务管理工具...</div>
                
                <div class="progress-wrapper">
                    <div id="loading-progress" class="progress-bar" style="width: 0%;"></div>
                </div>
                
                <div id="status-details" class="status-details"></div>
            </div>
            
            <!-- 操作按钮区域 -->
            <div class="action-section">
                <button id="manual-redirect-btn" class="primary-button" 
                        onclick="try { redirectToApp(); } catch(e) { console.error('按钮点击失败:', e); }" disabled>
                    立即打开应用
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        // 导入API配置和函数
        import { buildApiUrl, getApiConfig } from './assets/js/config/api.js';
        
        // 应用配置
        const APP_CONFIG = {
            defaultTargetUrl: 'pages/index.html', // 默认兜底页面地址
            serverCheckUrl: buildApiUrl('api/status/check-status'),
            serverCheckInterval: 200, // 轮询间隔200ms
            maxCheckTime: 3000, // 最大检查时间3秒
            manualButtonShowTime: 1500 // 显示手动按钮时间1.5秒
        };

        // 导入配置管理器模块
        if (typeof importScripts !== 'undefined') {
            // Web Worker环境
            try {
                importScripts('./assets/js/config/config_manager.js');
                console.log('✅ Web Worker环境下导入configManager成功');
            } catch (e) {
                console.error('❌ Web Worker环境下导入configManager失败:', e);
            }
        } else {
            // 浏览器环境
            const script = document.createElement('script');
            script.src = './assets/js/config/config_manager.js';
            script.type = 'text/javascript';
            script.onload = () => {
                console.log('✅ 配置管理器模块已成功加载');
            };
            script.onerror = (e) => {
                console.error('❌ 加载配置管理器模块失败:', e);
            };
            document.head.appendChild(script);
        }
        
        // 当前激活的指令信息
        let activeCommandInfo = null;
        
        // 监听插件进入事件，获取当前激活的指令信息
        if (typeof window.utools !== 'undefined') {
            try {
                console.log('设置uTools插件进入事件监听');
                window.utools.onPluginEnter(({code, type, payload}) => {
                    console.log(`✓ 检测到插件进入事件: code=${code}, type=${type}`);
                    activeCommandInfo = { code, type, payload };
                });
            } catch (e) {
                console.error('❌ 设置uTools插件进入事件监听失败:', e);
            }
        }
        
        // 本地保存features配置信息，用于根据code查找对应的page
        let pluginFeatures = [];
        
        // 确保configManager已加载
        if (typeof configManager === 'undefined') {
            console.error('❌ configManager 未加载，请检查导入语句');
            pluginFeatures = [];
        } else {
            try {
                // 使用配置管理器加载features配置
                pluginFeatures = await configManager.getPluginFeatures();
            } catch (error) {
                console.error('❌ 使用configManager加载features配置失败:', error);
                pluginFeatures = [];
            }
        }
        
        // 刷新功能 - 如果需要手动刷新缓存
        window.refreshPluginFeatures = async () => {
            if (typeof configManager !== 'undefined') {
                try {
                    pluginFeatures = await configManager.refreshPluginFeaturesCache();
                    console.log('✅ 配置已手动刷新');
                } catch (error) {
                    console.error('❌ 手动刷新配置失败:', error);
                }
            }
        };
        
        // 包装getTargetUrl以支持异步操作
        let cachedTargetUrl = null;
        async function getTargetUrlAsync() {
            if (cachedTargetUrl) {
                return cachedTargetUrl;
            }
            
            try {
                // 检查是否有从uTools指令传入的参数
                if (typeof window.utools !== 'undefined') {
                    try {
                        // 使用之前通过onPluginEnter事件捕获的activeCommandInfo
                        if (activeCommandInfo && activeCommandInfo.code) {
                            console.log(`检测到uTools指令激活: code=${activeCommandInfo.code}`);
                            console.log(`检测到uTools指令激活页面: page=${activeCommandInfo.page}`);
                            
                            // 根据code查找对应的页面路径
                            const feature = pluginFeatures.find(f => f.code === activeCommandInfo.code);
                            if (feature && feature.page) {
                                console.log(`✓ 通过activeCommandInfo找到对应页面: ${feature.page}`);
                                cachedTargetUrl = buildApiUrl(feature.page);
                                return cachedTargetUrl;
                            } else {
                                console.log(`未找到code=${activeCommandInfo.code}对应的页面配置`);
                            }
                        }
                    } catch (payloadError) {
                        console.error('处理uTools相关信息时发生错误:', payloadError);
                    }
                }
                
                // 尝试从URL参数中获取目标页面
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('target')) {
                        const targetParam = urlParams.get('target');
                        if (targetParam && typeof targetParam === 'string' && targetParam.trim()) {
                            console.log(`✓ 从URL参数获取目标页面: ${targetParam}`);
                            cachedTargetUrl = buildApiUrl(targetParam);
                            return cachedTargetUrl;
                        } else {
                            console.warn('URL参数target存在但内容无效，使用默认页面');
                        }
                    }
                } catch (urlParamsError) {
                    console.error('解析URL参数时发生错误:', urlParamsError);
                }
                
                // 默认使用兜底页面
                console.log(`✓ 使用默认兜底页面地址: ${APP_CONFIG.defaultTargetUrl}`);
                cachedTargetUrl = buildApiUrl(APP_CONFIG.defaultTargetUrl);
                return cachedTargetUrl;
            } catch (error) {
                console.error('❌ 获取动态目标地址时发生严重错误:', error.message || error);
                // 出错时返回兜底页面的完整URL
                try {
                    cachedTargetUrl = buildApiUrl(APP_CONFIG.defaultTargetUrl);
                    console.log('使用默认页面作为兜底方案');
                    return cachedTargetUrl;
                } catch (fallbackError) {
                    console.error('❌ 兜底方案也失败，使用基础URL');
                    return getApiConfig?.()?.baseURL || `http://localhost:${localStorage.getItem('serverPort') || 3000}`;
                }
            }
        }
        
        // 简化的更新状态显示函数
        function updateStatus(message, details = '') {
            const statusElement = document.getElementById('loading-status');
            if (statusElement) {
                statusElement.textContent = message;
                console.log(`状态更新: ${message}`);
            }
            
            const detailsElement = document.getElementById('status-details');
            if (detailsElement && details) {
                detailsElement.textContent = details;
            }
        }

        // 优化的跳转函数 - 使用uTools payload直接获取目标页面，使用iframe方式适配uTools环境
        async function redirectToApp() {
            try {
                // 每次调用时动态获取最新的目标地址
                let targetUrl = await getTargetUrlAsync();
                
                console.log('准备跳转到目标页面:', targetUrl);
                updateStatus('正在跳转到应用...', '目标页面: ' + targetUrl);
                
                // 在uTools环境中使用iframe方式加载目标页面
                if (typeof window.utools !== 'undefined') {
                    console.log('在uTools环境中使用iframe方式加载目标页面');
                    
                    // 创建iframe元素
                    const iframe = document.createElement('iframe');
                    iframe.src = targetUrl;
                    iframe.style.position = 'fixed';
                    iframe.style.top = '0';
                    iframe.style.left = '0';
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    iframe.style.zIndex = '1000';
                    
                    // iframe加载完成事件
                    iframe.onload = function() {
                        console.log('iframe加载完成');
                    };
                    
                    // iframe错误处理
                    iframe.onerror = function(error) {
                        console.error('iframe加载失败', error);
                        updateStatus('跳转失败，请手动点击下方按钮进入应用');
                        enableManualButton();
                        if (document.body.contains(iframe)) {
                            document.body.removeChild(iframe);
                        }
                    };
                    
                    // 添加iframe到页面
                    document.body.appendChild(iframe);
                    
                    // 立即隐藏引导页内容
                    const appContainer = document.querySelector('.app-container');
                    if (appContainer) {
                        appContainer.style.display = 'none';
                    }
                    
                    // 设置超时检查
                    setTimeout(function() {
                        if (!document.body.contains(iframe)) {
                            console.warn('iframe加载超时或已被移除，显示手动按钮');
                            updateStatus('跳转超时，请手动点击下方按钮进入应用');
                            enableManualButton();
                            if (appContainer) {
                                appContainer.style.display = 'block';
                            }
                        }
                    }, APP_CONFIG.manualButtonShowTime);
                    
                    return;
                }
                
                // 标准环境下使用location.href跳转
                console.log('使用标准location.href跳转');
                window.location.href = targetUrl;
                
            } catch (error) {
                console.error('跳转时发生严重错误:', error);
                updateStatus('跳转失败，请检查网络连接或稍后重试', '错误: ' + (error.message || '未知错误'));
                enableManualButton();
                
                // 自动重试机制 - 使用正确的异步函数语法和setTimeout调用
                setTimeout(async function() {
                    try {
                        console.log('尝试重试跳转...');
                        const fallbackUrl = await getTargetUrlAsync();
                        console.log('使用兜底URL:', fallbackUrl);
                        window.location.href = fallbackUrl;
                    } catch (retryError) {
                        console.error('重试跳转失败:', retryError);
                        updateStatus('跳转失败，请使用下方按钮');
                    }
                }, APP_CONFIG.maxCheckTime);
            }
        }

        // 启用手动跳转按钮
        function enableManualButton() {
            const redirectBtn = document.getElementById('manual-redirect-btn');
            if (redirectBtn) {
                redirectBtn.disabled = false;
                redirectBtn.textContent = '立即打开应用';
                console.log('手动跳转按钮已启用');
            }
        }

        // 检查服务器状态
        function checkServerStatus() {
            return new Promise((resolve) => {
                try {
                    fetch(APP_CONFIG.serverCheckUrl, {
                        method: 'GET',
                        timeout: 2000,
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            return response.json().catch(() => ({})); // 捕获JSON解析错误，返回空对象
                        }
                        resolve(false);
                        return Promise.reject('非成功状态码'); // 提前结束Promise链
                    })
                    .then(data => {
                        // 检查服务器是否就绪
                        const isReady = data?.data?.status === 'running' || 
                                     data?.status === 'ok' || 
                                     data?.ready || 
                                     Object.keys(data).length === 0; // 空对象也认为就绪（非JSON响应的情况）
                        resolve(isReady);
                    })
                    .catch(error => {
                        console.error('检查服务器状态时发生异常:', error);
                        resolve(false);
                    });
                } catch (error) {
                    console.error('检查服务器状态时发生异常:', error);
                    resolve(false);
                }
            });
        }

        // 更新进度条
        function updateProgress(progress) {
            const progressBar = document.getElementById('loading-progress');
            if (progressBar) {
                progressBar.style.width = `${Math.min(100, progress)}%`;
            }
        }

        // 初始化应用
        async function initApplication() {
            console.log('初始化应用...');
            
            const startTime = Date.now();
            let checkCount = 0;
            
            // 状态更新和进度条更新
            const updateStatusAndProgress = (message) => {
                const elapsedTime = Date.now() - startTime;
                const progress = Math.min(90, (elapsedTime / APP_CONFIG.maxCheckTime) * 100);
                updateProgress(progress);
                updateStatus(message);
            };

            // 定时显示手动跳转按钮
            const manualButtonTimer = setTimeout(() => {
                console.log('显示手动跳转按钮');
                enableManualButton();
                updateStatusAndProgress('点击按钮立即进入应用');
            }, APP_CONFIG.manualButtonShowTime);

            // 总超时处理
            const timeoutTimer = setTimeout(() => {
                console.log('检查超时，尝试直接跳转');
                clearInterval(pollingInterval);
                updateStatusAndProgress('连接超时，尝试直接访问应用');
                enableManualButton();
                setTimeout(redirectToApp, 1000);
            }, APP_CONFIG.maxCheckTime);

            // 轮询检查服务器状态
            updateStatusAndProgress('正在连接服务器...');
            const pollingInterval = setInterval(async () => {
                checkCount++;
                
                try {
                    const isServerReady = await checkServerStatus();
                    if (isServerReady) {
                        // 服务器就绪，清除所有计时器并跳转
                        clearInterval(pollingInterval);
                        clearTimeout(timeoutTimer);
                        clearTimeout(manualButtonTimer);
                        
                        updateProgress(100);
                        updateStatusAndProgress('服务器已就绪，正在跳转到应用...');
                        console.log(`服务器就绪，检查次数: ${checkCount}，耗时: ${Date.now() - startTime}ms`);
                        
                        // 稍微延迟跳转，让用户看到完成状态
                        setTimeout(redirectToApp, 500);
                    } else if (checkCount % 5 === 0) {
                        // 每5次尝试更新一次状态，避免频繁更新
                        updateStatusAndProgress(`正在连接服务器... (尝试 ${checkCount} 次)`);
                    }
                } catch (error) {
                    console.error('轮询过程中发生错误:', error);
                    // 继续尝试，不中断轮询
                }
            }, APP_CONFIG.serverCheckInterval);

            // 消息监听器 - 处理来自其他窗口的消息
            window.addEventListener('message', (e) => {
                try {
                    if (e.data && e.data.type === 'server-ready') {
                        console.log('收到服务器就绪消息');
                        clearInterval(pollingInterval);
                        clearTimeout(timeoutTimer);
                        clearTimeout(manualButtonTimer);
                        
                        updateProgress(100);
                        updateStatusAndProgress('服务器已就绪，正在跳转到应用...');
                        setTimeout(redirectToApp, 300);
                    }
                } catch (error) {
                    console.error('处理消息时发生错误:', error);
                }
            });
        }

        // 全局错误处理
        window.onerror = function(message, source, lineno) {
            console.error(`JavaScript错误 [${lineno}]:`, message);
            updateStatus('遇到技术问题，但我们会继续尝试', `行: ${lineno}`);
            enableManualButton();
            return true;
        };

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM内容已加载完成');
            
            // 设置uTools窗口大小（如果可用）
            if (typeof window.utools !== 'undefined') {
                try {
                    window.utools.setExpendHeight(600);
                    window.addEventListener('resize', () => window.utools.setExpendHeight(600));
                } catch (e) {
                    console.log('uTools窗口设置失败:', e);
                }
            }
            
            // 开始应用初始化
            initApplication();
        });
    </script>
</body>
</html>
