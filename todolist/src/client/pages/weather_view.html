<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报</title>
    <script src="/assets/js/third_party/tailwindcss.js"></script>
    <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/business/weather_view.css">
    <!-- 引入Chart.js用于绘制图表 -->
    <script src="/assets/js/third_party/chart.js"></script>
    <!-- 自定义配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        info: '#3b82f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .weather-card {
                transition: all 0.3s ease;
            }
            .weather-card:hover {
                transform: translateY(-2px);
            }
            .city-card {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            .day-hours-container {
                @apply bg-white rounded-xl shadow-md p-4 my-4;
            }
            .forecast-container {
                @apply bg-white rounded-xl shadow-md p-4 my-4;
            }
            .chart-container {
                @apply bg-white rounded-xl shadow-md p-4 mt-8;
            }
            .current-day-highlight {
                @apply border-2 border-primary ring-2 ring-primary/20;
            }
            .select-container select {
                @apply appearance-none bg-white border border-gray-300 text-gray-700 py-2 px-4 pr-8 rounded leading-tight focus:outline-none focus:border-primary;
            }
            .select-container {
                @apply relative;
            }
            .select-container::after {
                content: "\f078";
                font-family: "FontAwesome";
                @apply absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- 融合后的城市信息与选择区域 -->
        <div class="city-info-and-controls bg-white rounded-xl shadow-lg overflow-hidden mb-6">
            <!-- 顶部城市信息区域 - 包含月份选择 -->
            <div class="bg-gradient-to-r from-blue-400 to-purple-400 p-4">
                <div class="flex flex-col md:flex-row items-center justify-between text-white">
                    <div class="flex flex-col mb-2 md:mb-0">
                        <div class="flex items-center">
                            <div class="text-2xl font-bold" id="city-name">正在定位...</div>
                            <div class="text-sm text-white/80 ml-3" id="city-code">城市代码: ...</div>
                        </div>
                    </div>
                    
                    <div class="text-right">
                        <p class="text-lg font-medium" id="current-date">----年--月--日</p>
                    </div>
                </div>
            </div>
            
            <!-- 底部控制区域 - 添加重新定位按钮和省市区选择 -->
            <div class="bg-gradient-to-r from-blue-400 to-purple-400 p-4">
                <div class="flex flex-wrap items-center justify-between">
                    <button id="relocate-btn" class="bg-white/20 hover:bg-white/30 text-white font-medium py-2 px-6 rounded-full transition-all flex items-center shadow-md hover:shadow-lg">
                        <i class="fa fa-crosshairs mr-2"></i>重新定位
                    </button>
                    
                    <!-- 省市区三级联动选择区域 -->
                    <div class="flex items-center space-x-2 mt-2 sm:mt-0">
                        <select id="province-select" class="bg-white border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">请选择省份</option>
                        </select>
                        <select id="city-select" class="bg-white border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" disabled>
                            <option value="">请选择城市</option>
                        </select>
                        <select id="district-select" class="bg-white border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" disabled>
                            <option value="">请选择区县</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 为融合后的组件添加样式 - 优化UI -->
        <style>
            .city-info-and-controls {
                transition: all 0.3s ease;
                border-radius: 16px;
                overflow: hidden;
            }
            .city-info-and-controls:hover {
                box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
                transform: translateY(-1px);
            }
            /* 增强选择框的样式 */
            .select-container select {
                appearance: none;
                background: transparent;
                border: none;
                color: white;
                font-size: 0.875rem;
                height: 2.5rem;
                line-height: 1.5;
                outline: 0;
                padding: 0.375rem 1.5rem 0.375rem 0.75rem;
                width: 100%;
                z-index: 1;
                position: relative;
                cursor: pointer;
                font-weight: 500;
            }
            .select-container select:focus {
                background-color: rgba(255, 255, 255, 0.2);
                border-color: rgba(255, 255, 255, 0.5);
            }
            .select-container {
                transition: all 0.3s ease;
                position: relative;
                backdrop-filter: blur(5px);
            }
            .select-container::after {
                content: "\f078";
                font-family: "FontAwesome";
                position: absolute;
                right: 0.75rem;
                top: 50%;
                transform: translateY(-50%);
                pointer-events: none;
                color: rgba(255, 255, 255, 0.7);
                z-index: 0;
                transition: all 0.3s ease;
            }
            .select-container:hover::after {
                color: white;
            }
            /* 选择框选项样式 */
            .select-container select option {
                background-color: #1e40af;
                color: white;
                font-weight: 500;
                padding: 10px;
            }
            /* 按钮动画效果增强 */
            #refresh-btn, #locate-btn {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                backdrop-filter: blur(5px);
                font-weight: 500;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            #refresh-btn:hover, #locate-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
                border-color: rgba(255, 255, 255, 0.3);
            }
            #refresh-btn:active, #locate-btn:active {
                transform: translateY(0);
                box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            }
            /* 加载动画优化 */
            @keyframes pulse {
                0%, 100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }
            .animate-pulse {
                animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            /* 响应式布局增强 */
            @media (max-width: 768px) {
                .flex-1 {
                    width: 100%;
                }
                .min-w\[300px\], .min-w\[200px\] {
                    min-width: 100%;
                }
            }
        </style>
        
        <!-- 加载状态和错误信息 -->
        <div id="weather-loading" class="hidden flex justify-center items-center h-40">
            <div class="animate-pulse flex space-x-2">
                <div class="h-4 w-4 rounded-full bg-primary opacity-80"></div>
                <div class="h-4 w-4 rounded-full bg-primary opacity-60"></div>
                <div class="h-4 w-4 rounded-full bg-primary opacity-40"></div>
            </div>
        </div>
        
        <div id="weather-error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md mb-6">
            <strong class="font-bold">错误！</strong>
            <span class="block sm:inline">无法加载天气数据，请稍后重试。</span>
        </div>
        
        <!-- 天气内容容器 -->
        <div id="weather-content" class="space-y-6">
            <!-- 今天天气面板 -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">今日天气</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 主要天气信息 -->
                    <div class="flex flex-col items-center justify-center">
                        <div id="weather-icon" class="text-6xl mb-4 default-weather-icon">
                            <i class="fa fa-cloud"></i>
                        </div>
                        <div id="weather-condition" class="text-xl text-gray-600">--</div>
                        <div id="current-temp" class="text-4xl font-bold text-gray-800 mt-2">--°C</div>
                        <div id="temp-range" class="text-gray-500 mt-1">--°C / --°C</div>
                        <!-- 天气提示 -->
                        <div class="mt-4 w-full">
                            <div class="text-gray-500 text-sm mb-1">天气提示</div>
                            <div id="weather-tips" class="bg-blue-50 border-l-4 border-blue-400 p-3 rounded text-gray-700 text-sm">
                                --
                            </div>
                        </div>
                    </div>
                    
                    <!-- 详细天气信息 -->
                    <div class="flex flex-col justify-center">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-gray-50 p-3 rounded-lg">
                                <div class="flex items-center">
                                    <div class="text-primary text-sm mr-2" title="风向风力"><i class="fa fa-compass"></i></div>
                                    <div id="wind-info" class="text-base font-medium text-gray-800">--</div>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-lg">
                                <div class="flex items-center">
                                    <div class="text-primary text-sm mr-2" title="湿度"><i class="fa fa-tint"></i></div>
                                    <div id="humidity-info" class="text-base font-medium text-gray-800">--</div>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-lg">
                                <div class="flex items-center">
                                    <div class="text-primary text-sm mr-2" title="空气质量"><i class="fa fa-leaf"></i></div>
                                    <div id="air-quality" class="text-base font-medium text-gray-800">--</div>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-lg">
                                <div class="flex items-center">
                                    <div class="text-primary text-sm mr-2" title="能见度"><i class="fa fa-eye"></i></div>
                                    <div id="visibility-info" class="text-base font-medium text-gray-800">--</div>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-lg">
                                <div class="flex items-center">
                                    <div class="text-primary text-sm mr-2" title="限行信息"><i class="fa fa-car"></i></div>
                                    <div id="traffic-restriction" class="text-base font-medium text-gray-800">--</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 24小时天气 -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">24小时天气</h2>
                <!-- 上方显示天气和风力风向 -->
                <div id="hourly-weather-summary" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2 mb-6">
                    <!-- 每小时天气摘要将通过JavaScript动态加载 -->
                </div>
                <!-- 下方显示温度折线图 -->
                <div class="h-64">
                    <canvas id="24hour-chart"></canvas>
                </div>
            </div>
            
            <!-- 天气预报日历 -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">天气预报日历</h2>
                <div id="weather-calendar" class="grid grid-cols-7 gap-3">
                    <!-- 周一到周日的日历网格，每一格显示一天的天气 -->
                </div>
            </div>
            
            <!-- 气温趋势折线图 -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">气温趋势</h2>
                <div class="h-80">
                    <canvas id="weather-trend-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/business/weather_view.js"></script>
</body>
</html>
