<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo任务管理器</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <script src="/assets/js/third_party/tailwindcss.js"></script>
    <script src="/assets/js/third_party/lunar.js"></script>
    <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
    <link href="/assets/css/custom-styles.css" rel="stylesheet">
    <script src="/assets/js/business/common/festival_utils.js"></script>
    <script type="module" src="/assets/js/business/todo_manager.js"></script>
    <script>
        // 配置Tailwind自定义颜色和字体
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        priority: {
                            A: '#dc2626',    // 红色 - 优先级A（最高）
                            B: '#ea580c',    // 橙色 - 优先级B
                            C: '#fbbf24',    // 黄色 - 优先级C
                            D: '#10b981',    // 绿色 - 优先级D
                            E: '#64748b',    // 灰色 - 优先级E（最低）
                            none: '#94a3b8'  // 浅灰色 - 无优先级
                        },
                        status: {
                            completed: '#94a3b8',     // 灰色 - 已完成
                            overdue_pending: '#fbbf24', // 黄色 - 逾期未开始
                            overdue_inprogress: '#dc2626', // 红色 - 逾期未完成
                            upcoming: '#3b82f6',       // 蓝色 - 即将到期
                            pending: '#6366f1',        // 靛蓝色 - 未开始
                            inprogress: '#22C65F'      // 绿色 - 进行中
                        },
                        // 日历图例
            calendar: {
                weekday: '#ffffff',      // 白色 - 工作日
                weekend: '#dcfce7',      // 浅绿色 - 周六日（加深）
                holiday: '#fecdd9',      // 浅红色 - 节假日
                workday: '#efd8f6',      // 浅紫色 - 补班
                other_month: '#f3f4f6'   // 浅灰色 - 非本月日期（加深）
            },
            // 节日类型样式通过CSS类定义（见下方.bg-festival-*类）
                        // 任务专属颜色（唯一的颜色定义来源）
                        'task-color-1': '#eff6ff',
                        'task-color-2': '#f0fdf4',
                        'task-color-3': '#f5f3ff',
                        'task-color-4': '#fff7ed',
                        'task-color-5': '#fce7f3',
                        'task-color-6': '#e0f2fe',
                        'task-color-7': '#dcfce7',
                        'task-color-8': '#fdf2f8'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .calendar-day {
                @apply relative min-h-[140px] border border-gray-200 p-1 overflow-hidden;
            }
            /* 节日类型背景样式 */
            .bg-festival-traditional { @apply bg-red-400; } /* 传统节日：浅红色 */
            .bg-festival-common { @apply bg-red-500; } /* 常用节日：红色 */
            .bg-festival-foreign { @apply bg-purple-500; } /* 国外节日：紫色 */
            .bg-festival-terms { @apply bg-green-500; } /* 节气：绿色 */
            .bg-festival-custom { @apply bg-blue-500; } /* 自定义节日：蓝色 */

            .task-item {
                @apply mb-1.5 p-1.5 rounded text-xs cursor-pointer transition-all duration-200 hover:shadow-md whitespace-nowrap overflow-hidden text-ellipsis;
            }
            .task-item-first {
                @apply rounded-lg;
            }
            .task-item-middle {
                @apply rounded-lg opacity-70;
            }
            .task-item-last {
                @apply rounded-lg opacity-70;
            }
            .btn-action {
                @apply p-1.5 rounded hover:bg-gray-200 transition-colors duration-150;
            }
            .editing-breathing-bg {
                animation: breathe 2s infinite ease-in-out;
            }
            .priority-badge {
                @apply inline-flex items-center justify-center w-5 h-5 rounded-full text-white text-xs font-bold mr-1.5;
            }
            .task-number {
                @apply inline-flex items-center justify-center w-5 h-5 rounded-full bg-gray-200 text-gray-700 text-xs font-bold mr-1.5;
            }
            .continuous-task-container {
                @apply absolute left-0 right-0 h-6 overflow-hidden pointer-events-none;
            }
            .continuous-task-bar {
                @apply absolute h-full opacity-30;
            }
            .continuous-task-text {
                @apply absolute left-0 right-0 text-center text-xs font-medium pointer-events-auto cursor-pointer whitespace-nowrap overflow-hidden text-ellipsis;
            }
            .legend-item {
                @apply flex items-center mb-1;
            }
            .legend-color {
                @apply w-3.5 h-3.5 rounded-full mr-1.5;
            }
            /* 节日标签样式 - 与全局样式统一 */
            .festival-tag {
                @apply text-xs px-1 py-0.5 rounded text-white whitespace-nowrap;
            }
            .status-badge {
                @apply text-xs px-2 py-0.5 rounded font-medium;
            }
            /* 优化：任务列表边框改为低调灰色 */
            .task-list-border {
                @apply border-2 border-gray-200;
            }
            /* 日历任务边框（按任务ID映射颜色） */
            .task-calendar-border {
                @apply border-2;
            }
            /* 日历任务样式 */
            .calendar-task {
                @apply p-1 text-xs rounded border-2 shadow-sm truncate mb-1 bg-white cursor-pointer;
            }
            /* 任务背景色类 - 直接使用颜色值 */
            .bg-task-color-1 {
                background-color: #eff6ff;
            }
            .bg-task-color-2 {
                background-color: #f0fdf4;
            }
            .bg-task-color-3 {
                background-color: #f5f3ff;
            }
            .bg-task-color-4 {
                background-color: #fff7ed;
            }
            .bg-task-color-5 {
                background-color: #fce7f3;
            }
            .bg-task-color-6 {
                background-color: #e0f2fe;
            }
            .bg-task-color-7 {
                background-color: #dcfce7;
            }
            .bg-task-color-8 {
                background-color: #fdf2f8;
            }
            
            .calendar-task.pending {
                @apply border-status-pending;
            }
            .calendar-task.inprogress {
                @apply border-status-inprogress;
            }
            .calendar-task.completed {
                @apply border-status-completed;
            }
            .calendar-task.overdue-pending {
                @apply border-status-overdue_pending;
            }
            .calendar-task.overdue-inprogress {
                @apply border-status-overdue_inprogress;
            }
            .calendar-task.upcoming {
                @apply border-status-upcoming;
            }
            /* 日历任务进度指示器 */
            .task-progress {
                @apply text-[8px] text-gray-500;
            }
            /* 日历任务优先级标记 */
            .task-priority-marker {
                @apply inline-block w-4 h-4 rounded-full text-white text-center text-[8px] font-bold flex items-center justify-center mr-1;
            }
            /* 日历任务容器 */
            .calendar-tasks-container {
                @apply mt-1 space-y-1;
            }
            /* 日历任务更多指示器 */
            .more-tasks-indicator {
                @apply text-xs text-gray-500 ml-2;
            }
            @keyframes breathe {
                0%, 100% { background-color: rgba(59, 130, 246, 0.1); }
                50% { background-color: rgba(59, 130, 246, 0.2); }
            }
            /* 筛选下拉框样式优化 */
            /* 确保容器固定宽度和定位，防止内容变化影响布局 */
            .multiselect-dropdown {
                position: relative;
                width: 100%;
                display: block;
                min-width: 0;
            }
            
            /* 筛选文字说明固定样式，确保位置不变 */
            .filter-container label {
                display: inline-block;
                width: 60px;
                margin-right: 0.5rem;
                position: relative;
                z-index: 20;
                white-space: nowrap;
                line-height: 2rem;
            }
            
            /* 任务名筛选输入框和下拉勾选框高度一致 */
            .filter-container input,
            .multiselect-dropdown select[multiple] {
                height: 2rem !important;
                min-height: 2rem;
                width: calc(100% - 68px) !important;
                box-sizing: border-box !important;
                display: inline-block !important;
                margin: 0 !important;
                padding: 0.25rem 0.75rem !important;
                position: relative;
                vertical-align: middle;
            }
            
            /* 下拉框选项样式 - 强制选项内容不影响宽度 */
            .multiselect-dropdown select[multiple] option {
                padding: 4px 6px;
                padding-left: 28px;
                line-height: 1.5;
                font-size: 0.875rem;
                width: 100% !important;
                box-sizing: border-box !important;
                white-space: nowrap !important;
                text-overflow: ellipsis !important;
                overflow: hidden !important;
            }
            
            /* 下拉框折叠状态 */
            .multiselect-dropdown select[multiple] {
                overflow: hidden;
                position: relative;
                border: 1px solid #d1d5db;
                border-radius: 0.25rem;
                background-color: white;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            
            /* 确保整个筛选器网格布局稳定，让文字和选框在同一行 */
            .filter-container {
                display: flex;
                flex-direction: row;
                align-items: flex-start;
                width: 100%;
                position: relative;
                min-height: 2rem;
            }
            
            /* 进一步加强筛选文字说明的固定定位 */
            .filter-container label {
                display: inline-block !important;
                width: 60px !important;
                margin-right: 0.5rem !important;
                position: relative !important;
                z-index: 20 !important;
                white-space: nowrap !important;
                line-height: 2rem !important;
                flex-shrink: 0 !important;
            }
            
            /* 确保输入框和下拉框宽度计算精确并固定 */
            .filter-container input,
            .multiselect-dropdown select[multiple] {
                height: 2rem !important;
                min-width: 0 !important;
                width: calc(100% - 68px) !important;
                box-sizing: border-box !important;
                display: inline-block !important;
                margin: 0 !important;
                padding: 0.25rem 0.75rem !important;
                position: relative !important;
            }
            
            /* 下拉框展开状态 - 统一且稳定的样式定义 */
            .multiselect-dropdown select[multiple]:focus {
                height: auto !important;
                max-height: 200px !important;
                overflow-y: auto !important;
                position: static !important;
                z-index: 100 !important;
                border-color: #3b82f6 !important;
                outline: none !important;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1) !important;
                width: calc(100% - 68px) !important;
                min-width: 0 !important;
                margin-top: 0 !important;
            }
            
            /* 为multiselect-dropdown容器添加必要的定位和宽度控制 */
            .multiselect-dropdown {
                position: relative !important;
                width: 100% !important;
                display: block !important;
            }
            .multiselect-dropdown select[multiple]::-webkit-scrollbar {
                display: block;
                width: 6px;
            }
            .multiselect-dropdown select[multiple]::-webkit-scrollbar-track {
                background: #f1f1f1;
                border-radius: 3px;
            }
            .multiselect-dropdown select[multiple]::-webkit-scrollbar-thumb {
                background: #888;
                border-radius: 3px;
            }
            .multiselect-dropdown select[multiple]::-webkit-scrollbar-thumb:hover {
                background: #555;
            }
            /* 输入框样式优化 */
            .filter-container input[type="text"] {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 页面标题和图例区域 -->
        <header class="mb-8 flex flex-col md:flex-row items-start md:items-center">
            <div class="flex-1 flex flex-col justify-center items-center md:items-left mb-4 md:mb-0">
                <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-gray-800 mb-2">任务管理器</h1>
                <p class="text-gray-600 text-center md:text-left">管理您的待办事项，提高工作效率</p>
                <div class="mt-3">
                    <button id="btn-server-control" class="bg-red-500 text-white px-3 py-1.5 rounded hover:bg-red-600 transition-colors text-sm flex items-center h-7">
                        <i id="server-control-icon" class="fa fa-power-off mr-1"></i> 
                        <span id="server-control-text">关闭服务</span>
                    </button>
                </div>
            </div>
            
            <!-- 图例区域 - 按类别并排显示，支持水平滚动 -->
            <div class="mt-4 md:mt-0 bg-white p-2 rounded-lg shadow-sm border border-gray-100 legend-container inline-block">
                <h3 class="text-xs font-semibold text-gray-700 mb-1">图例</h3>
                <div class="flex overflow-x-auto pb-1 gap-5 no-scrollbar whitespace-nowrap">
                    <!-- 优先级图例 -->
                    <div class="flex flex-col legend-item-group">
                        <p class="text-[10px] text-gray-500 mb-1">优先级</p>
                        <div class="space-y-1">
                            <div class="legend-item">
                                <div class="legend-color bg-priority-A"></div>
                                <span class="text-[10px]">A (最高)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-priority-B"></div>
                                <span class="text-[10px]">B</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-priority-C"></div>
                                <span class="text-[10px]">C</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-priority-D"></div>
                                <span class="text-[10px]">D</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-priority-E"></div>
                                <span class="text-[10px]">E (最低)</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 状态图例 -->
                    <div class="flex flex-col legend-item-group">
                        <p class="text-[10px] text-gray-500 mb-1">任务状态</p>
                        <div class="space-y-1">
                            <div class="legend-item">
                                <div class="legend-color bg-status-pending"></div>
                                <span class="text-[10px]">未开始</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-status-inprogress"></div>
                                <span class="text-[10px]">进行中</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-status-completed"></div>
                                <span class="text-[10px]">已完成</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-status-overdue_pending"></div>
                                <span class="text-[10px]">逾期未开始</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-status-overdue_inprogress"></div>
                                <span class="text-[10px]">逾期未完成</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 节日类型图例 -->
                    <div class="flex flex-col legend-item-group">
                        <p class="text-[10px] text-gray-500 mb-1">节日类型</p>
                        <div class="space-y-1">
                            <div class="legend-item">
                                <div class="legend-color bg-festival-traditional"></div>
                                <span class="text-[10px]">传统节日</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-festival-common"></div>
                                <span class="text-[10px]">常用节日</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-festival-terms"></div>
                                <span class="text-[10px]">节气</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-festival-foreign"></div>
                                <span class="text-[10px]">外国节日</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-festival-custom"></div>
                                <span class="text-[10px]">自定义节日</span>
                            </div>

                        </div>
                    </div>
                    
                    <!-- 日历图例 -->
                    <div class="flex flex-col legend-item-group">
                        <p class="text-[10px] text-gray-500 mb-1">日期类型</p>
                        <div class="space-y-1">
                            <div class="legend-item">
                                <div class="legend-color bg-calendar-weekday border border-gray-200"></div>
                                <span class="text-[10px]">工作日</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-calendar-weekend"></div>
                                <span class="text-[10px]">周六日</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-calendar-holiday"></div>
                                <span class="text-[10px]">节假日</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-calendar-workday"></div>
                                <span class="text-[10px]">补班</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color bg-calendar-other_month"></div>
                                <span class="text-[10px]">非本月日期</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <style>
                /* 隐藏滚动条但保留滚动功能 */
                .no-scrollbar::-webkit-scrollbar {
                    display: none;
                }
                .no-scrollbar {
                    -ms-overflow-style: none;
                    scrollbar-width: none;
                }
                
                /* 任务高亮样式 */
                .task-highlight {
                    border-width: 4px !important;
                    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
                    transition: all 0.2s ease-in-out;
                }
            </style>
        </header>

        <!-- 控制面板 -->


        <!-- 筛选器 -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold text-gray-800">筛选任务</h3>
                <div class="flex items-center space-x-3">
                    <span class="text-sm text-gray-600" id="current-todo-file">任务文件: todo.txt</span>
                    <button id="toggle-detail-panel" class="text-sm bg-gray-200 px-2 py-1 rounded hover:bg-gray-300 transition-colors">
                        <i class="fa fa-chevron-down mr-1"></i> 详情
                    </button>
                </div>
            </div>
            
            <!-- 文件操作和节假日缓存操作的折叠浮层 -->

                <div class="bg-gray-50 p-3 rounded-md">
                    <!-- 第二行：文件操作 -->
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        <button id="btn-scan-files" class="bg-indigo-500 text-white px-3 py-1.5 rounded hover:bg-indigo-600 transition-colors text-sm flex items-center h-7 w-28 justify-center">
                            <i class="fa fa-folder-open mr-1"></i> 扫描文件

                        <select id="todo-file-select" class="border border-gray-300 rounded px-2 py-1.5 text-sm w-40 h-7">
                            <option value="todo.txt">todo.txt</option>
                        </select>
                        <button id="btn-load-file" class="bg-gray-200 px-3 py-1.5 rounded hover:bg-gray-300 transition-colors text-sm flex items-center h-7">
                            <i class="fa fa-refresh mr-1"></i> 加载
                        </button>
                    </div>
                    
                    <!-- 第三行：节假日缓存操作 -->
                    <!-- 节假日相关功能已移至节日管理页面 -->
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-10 gap-y-2">
                <div>
                    <div class="filter-container">
                        <label for="search-input" class="text-sm font-medium text-gray-700 block">任务名</label>
                        <input type="text" id="search-input" placeholder="输入正则表达式" class="w-full px-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 h-8" title="支持正则表达式搜索任务名称">
                    </div>
                </div>
                <div class="multiselect-dropdown">
                    <div class="filter-container">
                        <label class="text-sm font-medium text-gray-700 block">优先级</label>
                        <select id="priority-filter" name="priority" multiple class="w-full px-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" style="line-height: 1.2;">
                            <option value="all" selected>全部</option>
                            <option value="A">A (最高)</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E (最低)</option>
                            <option value="none">无</option>
                        </select>
                    </div>
                </div>
                <div class="multiselect-dropdown">
                    <div class="filter-container">
                        <label class="text-sm font-medium text-gray-700 block">状态</label>
                        <select id="status-filter" name="status" multiple class="w-full px-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" style="line-height: 1.2;">

                            <option value="pending">未开始</option>
                            <option value="inprogress">进行中</option>
                            <option value="upcoming">即将到期</option>
                            <option value="completed">已完成</option>
                            <option value="overdue_pending">逾期未开始</option>
                            <option value="overdue_inprogress">逾期未完成</option>
                        </select>
                    </div>
                </div>
                <div class="multiselect-dropdown">
                    <div class="filter-container">
                        <label class="text-sm font-medium text-gray-700 block">时间</label>

                            <option value="week">本周</option>
                            <option value="month">本月</option>
                        </select>
                    </div>
                </div>

                    <div class="filter-container">
                        <label class="text-sm font-medium text-gray-700 block">项目</label>
                        <select id="project-filter" name="project" multiple class="w-full px-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" style="line-height: 1.2;">
                            <option value="all" selected>全部</option>
                        <!-- 项目选项将通过JavaScript动态生成 -->
                        </select>
                    </div>
                </div>
                <div class="multiselect-dropdown">
                    <div class="filter-container">
                        <label class="text-sm font-medium text-gray-700 block">上下文</label>
                        <select id="context-filter" name="context" multiple class="w-full px-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" style="line-height: 1.2;">
                            <option value="all" selected>全部</option>
                        <!-- 上下文选项将通过JavaScript动态生成 -->
                        </select>
                    </div>
                </div>
                <div class="filter-container">
                    <button id="filter-search-btn" type="button" class="bg-blue-500 text-white px-4 py-1.5 rounded hover:bg-blue-600 transition-colors flex items-center h-full">
                        <i class="fa fa-search mr-1"></i> 查询
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab导航 -->
        <div class="flex mb-0 border-b border-gray-200">
            <button id="tab-list" class="px-4 py-2 font-medium text-blue-600 bg-white border border-gray-200 border-b-white rounded-t-md -mb-px mr-1">任务列表</button>
            <button id="tab-calendar" class="px-4 py-2 font-medium text-gray-500 bg-gray-50 border border-gray-200 border-b-gray-200 rounded-t-md -mb-px mr-1 hover:bg-gray-100">任务日历</button>
            <div class="ml-auto px-4 py-2 flex items-center">
                <div class="text-sm text-gray-500 mr-4" id="task-count">共 0 个任务</div>
                <button id="btn-add-task" class="bg-green-500 text-white px-4 py-1.5 rounded hover:bg-green-600 transition-colors flex items-center">
                    <i class="fa fa-plus mr-1"></i> 新增任务
                </button>
            </div>
        </div>

        <!-- 日历视图 -->
        <div id="calendar-view" class="bg-white rounded-lg shadow-md p-4 mb-6 overflow-x-auto hidden relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-800" id="calendar-month">2023年10月</h2>
                <button id="btn-back-to-list" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition-colors text-sm flex items-center absolute left-1/2 transform -translate-x-1/2">
                    <i class="fa fa-list-ul mr-1"></i> 返回列表
                </button>
                <div class="flex gap-2">
                    <button id="prev-month" class="btn-action">
                        <i class="fa fa-chevron-left"></i>
                    </button>
                    <button id="btn-today" class="btn-action px-2 text-sm font-medium bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors">
                        <i class="fa fa-calendar-o mr-1"></i> 今天
                    </button>
                    <button id="next-month" class="btn-action">
                        <i class="fa fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            
            <!-- 星期标题 -->
            <div class="grid grid-cols-7 mb-2 text-center min-w-[768px]">
                <div class="font-medium text-gray-500">周一</div>
                <div class="font-medium text-gray-500">周二</div>
                <div class="font-medium text-gray-500">周三</div>
                <div class="font-medium text-gray-500">周四</div>
                <div class="font-medium text-gray-500">周五</div>
                <div class="font-medium text-gray-500">周六</div>
                <div class="font-medium text-gray-500">周日</div>
            </div>
            
            <!-- 日历网格 -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-0 min-w-[768px]">
                <!-- 日历天数将通过JS动态生成 -->
            </div>
        </div>



        <!-- 任务列表 -->
        <div id="list-view" class="bg-white rounded-lg shadow-md p-4">
            
            <div id="task-list" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                <!-- 任务列表将通过JS动态生成 -->
                <div class="text-center text-gray-500 py-8">
                    <i class="fa fa-tasks text-4xl mb-2 opacity-30"></i>
                    <p>暂无任务，请添加新任务</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab切换逻辑
        document.addEventListener('DOMContentLoaded', function() {
            const tabList = document.getElementById('tab-list');
            const tabCalendar = document.getElementById('tab-calendar');
            const listView = document.getElementById('list-view');
            const calendarView = document.getElementById('calendar-view');

            tabList.addEventListener('click', function() {
                listView.classList.remove('hidden');
                calendarView.classList.add('hidden');
                
                // 更新任务列表Tab样式
                tabList.classList.add('text-blue-600', 'bg-white', 'border-b-white');
                tabList.classList.remove('text-gray-500', 'bg-gray-50', 'border-b-gray-200');
                
                // 更新任务日历Tab样式
                tabCalendar.classList.remove('text-blue-600', 'bg-white', 'border-b-white');
                tabCalendar.classList.add('text-gray-500', 'bg-gray-50', 'border-b-gray-200');
            });

            tabCalendar.addEventListener('click', function() {
                listView.classList.add('hidden');
                calendarView.classList.remove('hidden');
                
                // 更新任务日历Tab样式
                tabCalendar.classList.add('text-blue-600', 'bg-white', 'border-b-white');
                tabCalendar.classList.remove('text-gray-500', 'bg-gray-50', 'border-b-gray-200');
                
                // 更新任务列表Tab样式
                tabList.classList.remove('text-blue-600', 'bg-white', 'border-b-white');
                tabList.classList.add('text-gray-500', 'bg-gray-50', 'border-b-gray-200');
            });
        });
    </script>

    <!-- 任务编辑模态框 -->
    <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                        <span id="modal-title">新增任务</span>
                        <span id="task-id-display" class="ml-2 text-sm text-gray-500"></span>
                    </h3>
                    <button id="close-modal" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-times text-lg"></i>
                    </button>
                </div>
                
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    
                    <div class="mb-4">
                        <label for="task-title" class="block text-xs font-medium text-gray-700 mb-1">任务标题 *</label>
                        <input type="text" id="task-title" class="w-full px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" required>
                    </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="task-priority" class="block text-xs font-medium text-gray-700 mb-1">优先级</label>
                            <select id="task-priority" class="w-full px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 h-8 text-sm">
                                <option value="none">无</option>
                                <option value="A">A (最高)</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E (最低)</option>
                            </select>
                        </div>
                        <div>
                            <label for="task-status" class="block text-xs font-medium text-gray-700 mb-1">状态</label>
                            <select id="task-status" class="w-full px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 h-8 text-sm">
                                <option value="pending">未开始</option>
                                <option value="inprogress">进行中</option>
                                <option value="completed">已完成</option>
                            </select>
                        </div>
                    </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="task-start-date" class="block text-xs font-medium text-gray-700 mb-1">开始日期</label>
                            <input type="date" id="task-start-date" class="w-full px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 h-8 text-sm">
                        </div>
                        <div>
                            <label for="task-due-date" class="block text-xs font-medium text-gray-700 mb-1">截止日期</label>
                            <input type="date" id="task-due-date" class="w-full px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 h-8 text-sm">
                        </div>
                    </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="task-project" class="block text-xs font-medium text-gray-700 mb-1">项目 (可选)</label>
                            <input type="text" id="task-project" placeholder="例如: 工作" class="w-full px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 h-8 text-sm">
                        </div>
                        <div>
                            <label for="task-context" class="block text-xs font-medium text-gray-700 mb-1">上下文 (可选)</label>
                            <input type="text" id="task-context" placeholder="例如: 电脑旁" class="w-full px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 h-8 text-sm">
                        </div>
                    </div>
                
                <div class="mb-6">
                        <label for="task-note" class="block text-xs font-medium text-gray-700 mb-1">备注 (可选)</label>
                        <textarea id="task-note" rows="3" class="w-full px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="添加详细描述..."></textarea>
                    </div>
                
                <div class="flex justify-end gap-3">
                        <button type="button" id="cancel-task" class="px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition-colors text-sm">取消</button>
                        <button type="submit" class="px-3 py-1.5 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors text-sm">保存</button>
                    </div>
            </form>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">确认删除</h3>
            <p class="text-gray-600 mb-6" id="delete-task-title">您确定要删除这个任务吗？</p>
            <input type="hidden" id="delete-task-id">
            <div class="flex justify-end gap-3">
                <button id="cancel-delete" class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition-colors">取消</button>
                <button id="confirm-delete" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition-colors">删除</button>
            </div>
        </div>
    </div>

    <!-- 确认关闭服务模态框 -->
    <div id="shutdown-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">确认关闭服务</h3>
            <p class="text-gray-600 mb-6" id="shutdown-message">确定要关闭待办事项管理系统吗？</p>
            <div class="flex justify-end gap-3">
                <button id="cancel-shutdown" class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition-colors">取消</button>
                <button id="confirm-shutdown" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition-colors">关闭服务</button>
            </div>
        </div>
    </div>
</body>
</html>
