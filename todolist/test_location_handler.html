<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试省市县数据加载</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-container {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2563eb;
        }
        .results {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
        .loading {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <h1>省市县数据加载测试</h1>
    
    <div class="test-container">
        <h2>测试LocationDataManager.getFullAreaData()</h2>
        <button id="test-area-data">加载省市县数据</button>
        <div id="area-data-results" class="results">
            <p class="loading">点击按钮开始测试...</p>
        </div>
    </div>

    <script>
        // 模拟必要的依赖
        window.logStep = console.log;
        
        // 直接测试省市县数据加载逻辑
        async function testAreaDataLoading() {
            const resultsDiv = document.getElementById('area-data-results');
            resultsDiv.innerHTML = '<p class="loading">正在加载省市县数据...</p>';
            
            try {
                // 直接调用API，模拟LocationDataManager的行为
                const response = await fetch('/api/weather/weather-area-codes', { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }
                
                const responseData = await response.json();
                console.log('API响应:', responseData);
                
                // 验证数据格式
                if (!responseData || !('data' in responseData) || !('timestamp' in responseData)) {
                    throw new Error('API返回的数据格式不正确，缺少必要字段');
                }
                
                if (!Array.isArray(responseData.data) || responseData.data.length === 0) {
                    throw new Error('data字段不是有效的数组或为空');
                }
                
                // 提取区域数据
                const areaData = responseData.data;
                
                resultsDiv.innerHTML = `
                    <p class="success">✓ 成功加载省市县数据！</p>
                    <p><strong>返回格式验证:</strong></p>
                    <ul>
                        <li>包含data字段: <span class="success">是</span></li>
                        <li>包含timestamp字段: <span class="success">是</span></li>
                        <li>data是数组: <span class="success">是</span></li>
                        <li>数据量: ${areaData.length} 个省份</li>
                    </ul>
                    <p><strong>数据样本:</strong></p>
                    <pre>${JSON.stringify(areaData.slice(0, 2), null, 2)}</pre>
                `;
                
                console.log('前端数据加载测试成功');
            } catch (error) {
                console.error('前端数据加载测试失败:', error);
                resultsDiv.innerHTML = `
                    <p class="error">✗ 加载失败: ${error.message}</p>
                    <p>错误详情已打印到控制台</p>
                `;
            }
        }
        
        document.getElementById('test-area-data').addEventListener('click', testAreaDataLoading);
    </script>
</body>
</html>
